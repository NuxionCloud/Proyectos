<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>QR Mesas — Bocatitos</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; margin: 0; background: #fff; }
  .card { width: 9cm; height: 12cm; border: 3px solid #1a1a1a; border-radius: 16px;
    display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
    margin: 0.5cm; background: #FFE500; page-break-inside: avoid; }
  .card h1 { font-size: 26px; margin: 0 0 4px; color: #1a1a1a; }
  .card h2 { font-size: 18px; margin: 0 0 12px; font-weight: normal; color: #1a1a1a; }
  .card img { width: 6.5cm; height: 6.5cm; border: 6px solid #fff; border-radius: 12px; background: #fff; }
  .card p { font-size: 14px; margin: 12px 0 0; color: #1a1a1a; font-weight: bold; }
  @media print { .card { margin: 0.3cm; } }
</style>
</head>
<body>
  <div class="card">
    <h1>BOCATITOS</h1><h2>Local — Mesa 1</h2>
    <img src="mesa-L1.png" alt="QR Mesa L1">
    <p>Escanea y pide por WhatsApp</p>
  </div>
  <div class="card">
    <h1>BOCATITOS</h1><h2>Local — Mesa 2</h2>
    <img src="mesa-L2.png" alt="QR Mesa L2">

  </div>
  <div class="card">
    <h1>BOCATITOS</h1><h2>Terraza — Mesa 1</h2>
    <img src="mesa-T1.png" alt="QR Mesa T1">

  </div>
</body>
</html>
